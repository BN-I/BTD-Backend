<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>New Review Received</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #f4f4f4;
        color: #333333;
      }
      .container {
        max-width: 600px;
        margin: 30px auto;
        background-color: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        background-color: #000;
        color: #ffffff;
        padding: 20px;
        text-align: center;
      }
      .content {
        padding: 30px;
      }
      .footer {
        background-color: #f0f0f0;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #777777;
      }
      .btn {
        display: inline-block;
        background-color: #000;
        color: white !important;
        padding: 12px 24px;
        margin-top: 20px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }
      .info-box {
        background-color: #f8f9fa;
        border-left: 4px solid #000;
        padding: 15px;
        margin: 20px 0;
        border-radius: 4px;
      }
      .info-row {
        margin: 8px 0;
        font-size: 14px;
      }
      .info-label {
        font-weight: 600;
        color: #666;
        display: inline-block;
        width: 90px;
      }
      .stars {
        color: #f5a623;
        font-size: 18px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img
          src="cid:btd-logo"
          alt="Before The Dates"
          width="40"
          height="40"
          style="
            display: inline-block;
            vertical-align: middle;
            margin-right: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            padding: 6px;
          "
        />
        <h1 style="display: inline-block; vertical-align: middle; margin: 0">
          Before The Dates
        </h1>
      </div>
      <div class="content">
        <h2>Hi {{vendorName}},</h2>
        <p>
          You've received a new review on <strong>{{productTitle}}</strong>.
        </p>

        <div class="info-box">
          <div class="info-row">
            <span class="info-label">Rating:</span>
            <span class="stars">{{starsDisplay}}</span> ({{rating}}/5)
          </div>
          <div class="info-row">
            <span class="info-label">Customer:</span> {{customerName}}
          </div>
          <div class="info-row">
            <span class="info-label">Comment:</span> {{comment}}
          </div>
        </div>

        <a href="{{dashboardUrl}}" class="btn">View in Dashboard</a>
      </div>
      <div class="footer">
        &copy; 2025 Before The Dates. All rights reserved.<br />
        Need help? Contact us at
        <a href="mailto:support@beforethedates.com"
          >support@beforethedates.com</a
        >
      </div>
    </div>
  </body>
</html>
